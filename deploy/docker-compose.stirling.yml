services:
  stirling-pdf:
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:latest
    container_name: stirling-pdf
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SYSTEM_ROOTURIPATH: /tools/pdf
      SECURITY_ENABLELOGIN: "false"
      SYSTEM_DEFAULTLOCALE: en-US
      UI_APPNAME: PDF Tools
      UI_APPNAMENAVBAR: PDF Tools
    volumes:
      - stirling-data:/usr/share/tessdata
      - stirling-config:/configs
      - stirling-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/tools/pdf/api/v1/info/status | grep -q UP"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  stirling-data:
  stirling-config:
  stirling-logs:
